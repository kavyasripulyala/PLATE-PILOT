<!DOCTYPE html>
<html>

<head>

<title>Register</title>

<link rel="stylesheet"
href="style.css">

</head>

<body>

<div class="auth-container">

<div class="auth-card">

<h2>Create Account 🥗</h2>

<form action="dashboard.html">

<input
type="text"
placeholder="Full Name"
required>

<input
type="email"
placeholder="Email"
required>

<input
type="password"
placeholder="Password"
required>

<select>

<option>
Vegetarian
</option>

<option>
Non-Veg
</option>

<option>
Vegan
</option>

</select>

<button type="submit">
Create Account
</button>

</form>

<div class="bottom-link">

Already Registered?

<a href="index.html">
Login
</a>

</div>

</div>

</div>

</body>

</html>
